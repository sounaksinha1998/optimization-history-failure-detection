[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "optimization-history-failure-detection"
version = "0.1.0"
description = "Associative memory replacement for optimization-history failure detection research"
readme = "docs/COPY_MANIFEST.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.30",
    "optax>=0.2.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0",
    "Pillow>=10.0.0",
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
include = ["optimizer*", "research*"]

[tool.poetry]
packages = [
    { include = "optimizer" },
    { include = "research" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)"
]
